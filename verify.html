<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Code | FFVERSE</title>
  <meta name="theme-color" content="#07050d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style2.css">
</head>
<body data-page="verify">
  <div class="bg-glow bg-glow--one" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--two" aria-hidden="true"></div>

  <main class="auth-main">
    <section class="auth-card">
      <a href="index.html" class="brand" aria-label="FFVERSE home">FF<span>VERSE</span></a>
      <h1>Enter your code</h1>
      <p class="sub">We sent a 6-digit code to <strong id="emailShown"></strong>. It can take a minute to arrive, so check your spam folder too.</p>

      <form id="verifyForm" novalidate>
        <div class="otp" role="group" aria-label="6-digit code">
          <input class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1">
          <input class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 2">
          <input class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 3">
          <input class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 4">
          <input class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 5">
          <input class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 6">
        </div>

        <p class="msg" id="message" role="alert" aria-live="polite"></p>

        <button type="submit" class="btn" id="submitBtn" style="margin-top:18px">Verify</button>
        <button type="button" class="btn-link" id="resendBtn" disabled>Resend code</button>
      </form>

      <p class="switch"><a href="signup.html" id="wrongEmail">Wrong email? Start again</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="avatar.js"></script>
  <script src="auth.js"></script>
</body>
</html>
