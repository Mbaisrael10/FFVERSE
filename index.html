<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">FV esports logo</title>
  <desc id="desc">Angular silver and neon-purple FV monogram with a crown and sweeping orbital accents on a transparent background.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#dce2f2"/>
      <stop offset=".72" stop-color="#8992aa"/>
      <stop offset="1" stop-color="#f8f8ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b6ff"/>
      <stop offset=".35" stop-color="#bd36ff"/>
      <stop offset=".72" stop-color="#7600ff"/>
      <stop offset="1" stop-color="#3c00a8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7caff"/>
      <stop offset="1" stop-color="#7200ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dy="10" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Neon orbital accents -->
  <path d="M145 493 C65 420 116 313 280 245 C468 167 711 150 857 205"
        fill="none" stroke="#8b00ff" stroke-width="13" opacity=".9" filter="url(#glow)"/>
  <path d="M145 493 C65 420 116 313 280 245 C468 167 711 150 857 205"
        fill="none" stroke="#e7b4ff" stroke-width="3"/>
  <path d="M850 206 C935 252 927 348 824 425"
        fill="none" stroke="url(#edge)" stroke-width="9" filter="url(#glow)"/>

  <!-- Crown -->
  <g transform="translate(270 92)" filter="url(#glow)">
    <path d="M0 104 L18 24 L70 69 L112 0 L151 69 L204 24 L219 105 Z"
          fill="#16002e" stroke="url(#edge)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M18 105 L204 105 L190 127 L32 127 Z" fill="url(#violet)" stroke="#f2caff" stroke-width="5"/>
    <circle cx="18" cy="24" r="8" fill="#fff"/>
    <circle cx="112" cy="0" r="9" fill="#fff"/>
    <circle cx="204" cy="24" r="8" fill="#fff"/>
  </g>

  <!-- Monogram dark extrusion -->
  <g filter="url(#shadow)" stroke="#090012" stroke-width="28" stroke-linejoin="miter">
    <path d="M190 548 L330 260 L610 260 L562 350 L390 350 L365 401 L525 401 L480 486 L324 486 L294 548 Z"
          fill="#090012"/>
    <path d="M545 270 L680 270 L747 427 L866 270 L970 270 L755 567 L684 567 Z"
          fill="#090012"/>
  </g>

  <!-- F -->
  <path d="M190 548 L330 260 L610 260 L562 350 L390 350 L365 401 L525 401 L480 486 L324 486 L294 548 Z"
        fill="url(#silver)" stroke="#f7f3ff" stroke-width="7" stroke-linejoin="miter"/>
  <path d="M330 260 L610 260 L562 350 L390 350 L365 401 L525 401"
        fill="none" stroke="#ffffff" stroke-width="8" opacity=".8"/>
  <path d="M190 548 L294 548 L324 486 L365 401 L330 260"
        fill="none" stroke="#8d00ff" stroke-width="7" opacity=".95"/>

  <!-- V -->
  <path d="M545 270 L680 270 L747 427 L866 270 L970 270 L755 567 L684 567 Z"
        fill="url(#violet)" stroke="#e8b8ff" stroke-width="7" stroke-linejoin="miter"/>
  <path d="M565 292 L666 292 L747 480 L888 292 L932 292"
        fill="none" stroke="#ffdfff" stroke-width="8" opacity=".75"/>
  <path d="M684 567 L755 567 L970 270"
        fill="none" stroke="#6a00db" stroke-width="7"/>

  <!-- Bright slash highlights -->
  <path d="M222 516 L337 281 L371 281 L267 516 Z" fill="#fff" opacity=".16"/>
  <path d="M705 301 L744 301 L783 390 L753 433 Z" fill="#fff" opacity=".16"/>
  <path d="M770 551 L944 309" stroke="#ffccff" stroke-width="4" opacity=".75" filter="url(#glow)"/>

  <!-- Small sparkle accents -->
  <g fill="#fff" filter="url(#glow)">
    <path d="M830 170 L838 190 L858 198 L838 206 L830 226 L822 206 L802 198 L822 190 Z"/>
    <path d="M135 470 L141 485 L156 491 L141 497 L135 512 L129 497 L114 491 L129 485 Z"/>
  </g>
</svg>
