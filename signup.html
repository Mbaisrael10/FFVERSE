<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | FFVERSE</title>
  <meta name="theme-color" content="#07050d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style2.css">
</head>
<body data-page="signup">
  <div class="bg-glow bg-glow--one" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--two" aria-hidden="true"></div>

  <main class="auth-main">
    <section class="auth-card">
      <a href="index.html" class="brand" aria-label="FFVERSE home">FF<span>VERSE</span></a>
      <h1>Create your account</h1>
      <p class="sub">Join FFVERSE to save your settings and pick your avatar.</p>

      <div class="social">
        <button type="button" class="btn-social" data-provider="google">
          <span class="social-icon" aria-hidden="true">G</span> Continue with Google
        </button>
        <button type="button" class="btn-social" data-provider="facebook">
          <span class="social-icon" aria-hidden="true">f</span> Continue with Facebook
        </button>
      </div>

      <div class="divider"><span>or sign up with email</span></div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" maxlength="20" placeholder="Your gamer tag">
          <p class="hint">3 to 20 letters, numbers or underscores.</p>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" maxlength="100" placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" autocomplete="new-password" maxlength="72" placeholder="Create a password">
            <button type="button" class="pw-toggle" data-toggle-password="password" aria-pressed="false">Show</button>
          </div>
          <div class="strength"><div class="strength__bar" id="strengthBar" data-level="0"></div></div>
          <p class="hint" id="strengthText">Use 8+ characters with upper and lower case letters and a number.</p>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="pw-wrap">
            <input type="password" id="confirmPassword" autocomplete="new-password" maxlength="72" placeholder="Type it again">
            <button type="button" class="pw-toggle" data-toggle-password="confirmPassword" aria-pressed="false">Show</button>
          </div>
        </div>

        <div class="field">
          <span class="label" id="avatarLabel">Choose your avatar</span>
          <div id="avatarPicker" class="avatar-grid" role="radiogroup" aria-labelledby="avatarLabel"></div>
        </div>

        <!-- Spam trap: real people never see or fill this -->
        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="check">
          <input type="checkbox" id="terms">
          <label for="terms">I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</label>
        </div>

        <button type="submit" class="btn" id="submitBtn">Create account</button>
        <p class="msg" id="message" role="alert" aria-live="polite"></p>
      </form>

      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="avatar.js"></script>
  <script src="auth.js"></script>
</body>
</html>
